<script type="text/plain" id="coreSrc">// ZMANIM v8.4 - upload to each Shelly (Run on startup ON). One script for 1-4 relays (Mini, Pro 1, Pro 4PM). Times: daily GitHub job (times/<location>.v2.csv); gh preset to cgr210/zmanim-ui
let CFG={loc:"london",switchId:0,restoreOnBoot:true,refreshHrs:6,gh:"cgr210/zmanim-ui",peers:[],holy:{enabled:true,israel:false,candleMins:15,havMode:1,geo:0,rtMins:72,pauseSchedules:true}};let CH=[];for(let i=0;i<4;i++)if(Shelly.getComponentStatus("switch:"+i))CH.push(i);if(!CH.length)CH.push(CFG.switchId);function kk(base,ch){return ch===CH[0]?base:base+"_"+ch}function chOk(c){return c!==null&&has(CH,c)}let Q=[],inFlight=0,QMAX=3;function call(m,p,cb){Q.push([m,p,cb]);pump()}function run(c){inFlight++;Shelly.call(c[0],c[1],function(r,e,msg){inFlight--;if(c[2])c[2](r,e,msg);pump()})}function pump(){while(inFlight<QMAX&&Q.length){let c=Q[0],nq=[];for(let i=1;i<Q.length;i++)nq.push(Q[i]);Q=nq;run(c)}}let events=[];let lastT=0;let offsetSec=0;let made=0;let first=true;function num(s){let v=0;for(let i=0;i<s.length;i++)v=v*10+(s.charCodeAt(i)-48);return v}function pad(x){return x<10?"0"+x:""+x}function dfc(y,m,d){if(m<=2)y--;let era=Math.floor(y/400),yoe=y-era*400;let doy=Math.floor((153*(m+(m>2?-3:9))+2)/5)+d-1;let doe=yoe*365+Math.floor(yoe/4)-Math.floor(yoe/100)+doy;return era*146097+doe-719468}function ymd(z){z+=719468;let era=Math.floor(z/146097),doe=z-era*146097;let yoe=Math.floor((doe-Math.floor(doe/1460)+Math.floor(doe/36524)-Math.floor(doe/146096))/365);let y=yoe+era*400;let doy=doe-(365*yoe+Math.floor(yoe/4)-Math.floor(yoe/100));let mp=Math.floor((5*doy+2)/153);let d=doy-Math.floor((153*mp+2)/5)+1;let m=mp+(mp<10?3:-9);if(m<=2)y++;return y+"-"+pad(m)+"-"+pad(d)}function sortByT(a){for(let i=1;i<a.length;i++){let x=a[i],j=i-1;while(j>=0&&a[j].t>x.t){a[j+1]=a[j];j--}a[j+1]=x}}function has(arr,v){for(let i=0;i<arr.length;i++)if(arr[i]===v)return true;return false}function fmt(t){let s=t+offsetSec,d=Math.floor(s/86400),r=s-d*86400;return ymd(d)+" "+pad(Math.floor(r/3600))+":"+pad(Math.floor(r%3600/60))}function listEvents(){for(let i=0;i<events.length;i++)print(fmt(events[i].t)+"  "+actTxt(events[i].on)+(events[i].on===null?"    ":" #"+events[i].ch+" ")+events[i]   var devs = defaults.map(function (def, i) {
    var st = saved && saved.devs && saved.devs[i];
    var d = { ip: def.ip, mac: def.mac, id: def.id, name: st ? st.name : def.name,
      kv: st ? st.kv : JSON.parse(JSON.stringify(def.kv)), jobs: st ? st.jobs : JSON.parse(JSON.stringify(def.jobs)),
      outs: st && st.outs ? st.outs : (def.outs || [def.out]).slice(), chn: (st && st.chn) || def.chn || [""], handlers: [], timers: [], ev: null };
    boot(d, !!st);
    return d;
  });

  // ---------------------------------------------------------------- one device
  function boot(d, rebooted) {
    function status(c) {
      if (c === "sys") { var t = unix(); return { unixtime: t, utc_offset: offset(t) }; }
      var m = /^switch:(\d)$/.exec(c);
      if (m && +m[1] < d.outs.length) return { id: +m[1], output: d.outs[+m[1]] };
      return null;
    }
    var api = {
      Shelly: {
        call: function (m, p, cb) {
          // like the device: the action happens now, the callback comes later
          var out, ec = 0, em = "";
          if (m !== "HTTP.GET") { try { out = rpc(d, m, p || {}, "script"); } catch (e) { out = null; ec = e.code || -1; em = e.message || "error"; } }
          later(function () {
          if (m === "HTTP.GET") {
            fetch(p.url, { cache: "no-store" }).then(function (r) { return r.text().then(function (b) { return { code: r.status, body: b.replace(/made=\d+/, "made=" + unix()) }; }); })
              .then(function (r) { cb && cb(r, 0, ""); }, function () { cb && cb(null, -114, "network error"); });
            return;
          }
          cb && cb(out, ec, em);
        }); },
        addStatusHandler: function (f) { d.handlers.push(f); },
        getComponentStatus: status,
        getComponentConfig: function (c) { var m = /^switch:(\d)$/.exec(c); return m && +m[1] < d.outs.length ? { id: +m[1], name: d.chn[+m[1]] || null } : null; },
        getCurrentScriptId: function () { return 3; },
        getDeviceInfo: function () { return { name: d.name, id: d.id, mac: d.mac }; }
      },
      Timer: {
        set: function (ms, rep, f) { var h = rep ? setInterval(f, ms) : setTimeout(f, ms); if (rep) d.timers.push(f); return h; },
        clear: function (h) { clearTimeout(h); clearInterval(h); }
      },
      HTTPServer: { registerEndpoint: function (n) { return n; } },
      print: function (s) { console.log("[" + d.name + "] " + s); }
    };
    var src = document.getElementById("coreSrc").textContent;
    var make = new Function("Shelly", "Timer", "HTTPServer", "print", src + "\n;return function(__c){return eval(__c);};");
    d.ev = make(api.Shelly, api.Timer, api.HTTPServer, api.print);
    if (rebooted) d.ev("CFG.restoreOnBoot=false");   // a page reload isn't a power cut
  }

  function setOut(d, id, on, source) {
    if (id >= d.outs.length || d.outs[id] === on) return;
    d.outs[id] = on; save();
    d.handlers.forEach(function (f) { try { f({ component: "switch:" + id, delta: { output: on, source: source } }); } catch (e) { console.error(e); } });
  }

  function err(code, message) { var e = new Error(message); e.code = code; throw e; }

  function rpc(d, m, p, via) {
    switch (m) {
      case "Shelly.GetDeviceInfo": return { name: d.name, id: d.id, mac: d.mac, model: d.id.indexOf("pro4pm") > 0 ? "SPSW-104PE16EU" : d.id.indexOf("pro") === 0 ? "SPSW-201XE16EU" : "S4SW-001X8EU", gen: 2 };
      case "Wifi.GetStatus": return { sta_ip: d.ip, status: "got ip" };
      case "Sys.GetConfig": return { device: { name: d.name, mac: d.mac }, location: { tz: "Europe/London", lat: 51.5484, lon: 0.1716 } };
      case "Eth.GetStatus": err(-114, "No handler for Eth.GetStatus");
      case "Sys.SetConfig": d.name = (p.config && p.config.device && p.config.device.name) || null; save(); return { restart_required: false };
      case "Switch.Set": setOut(d, p.id || 0, !!p.on, via === "script" ? "loopback" : via); return { was_on: !p.on };
      case "Switch.SetConfig": if ((p.id || 0) >= d.outs.length) err(-105, "No switch " + p.id); d.chn[p.id || 0] = (p.config && p.config.name) || ""; save(); return { restart_required: false };
      case "Switch.GetStatus": return { id: p.id || 0, output: d.outs[p.id || 0] };
      case "KVS.Get": if (!(p.key in d.kv)) err(-105, "Argument 'key', value '" + p.key + "' not found !"); return { etag: "x", value: d.kv[p.key] };
      case "KVS.Set": d.kv[p.key] = String(p.value); save(); return { etag: "x", rev: 1 };
      case "KVS.Delete": delete d.kv[p.key]; save(); return { rev: 1 };
      case "Schedule.List": return { jobs: JSON.parse(JSON.stringify(d.jobs)), rev: 1 };
      case "Schedule.Create": {
        var id = 1; d.jobs.forEach(function (j) { if (j.id >= id) id = j.id + 1; });
        d.jobs.push({ id: id, enable: p.enable !== false, timespec: p.timespec, calls: p.calls || [] }); save(); return { id: id, rev: 1 };
      }
      case "Schedule.Update": {
        var j = d.jobs.filter(function (x) { return x.id === p.id; })[0]; if (!j) err(-105, "Schedule " + p.id + " not found");
        ["enable", "timespec", "calls"].forEach(function (k) { if (k in p) j[k] = p[k]; }); save(); return { rev: 1 };
      }
      case "Schedule.Delete": d.jobs = d.jobs.filter(function (x) { return x.id !== p.id; }); save(); return { rev: 1 };
      case "Script.List": return { scripts: [{ id: 1, name: "other", enable: false, running: false }, { id: 3, name: "Zmanim core", enable: true, running: true }] };
      case "Script.Eval":
        if (p.id !== 3) err(-105, "Script not running");
        var r = d.ev(p.code);
        return { result: r === undefined ? "undefined" : r };
      case "HTTP.Request": {
        var u = /^http:\/\/([\d.]+)\/rpc$/.exec(p.url || ""), peer = u && devs.filter(function (x) { return x.ip === u[1]; })[0];
        if (!peer) err(-104, "Failed to connect to " + (u ? u[1] : p.url));
        var q = JSON.parse(p.body), res;
        try { res = { id: q.id, result: rpc(peer, q.method, q.params || {}, "http") }; }
        catch (e) { res = { id: q.id, error: { code: e.code || -1, message: e.message } }; }
        return { code: 200, message: "OK", body: JSON.stringify(res) };
      }
    }
    err(-114, "No handler for " + m);
  }

  // the page's own fetch("/rpc") goes to the first device
  var realFetch = window.fetch.bind(window);
  window.fetch = function (url, opt) {
    if (url !== "/rpc") return realFetch(url, opt);
    return new Promise(function (ok) {
      var q = JSON.parse(opt.body), res;
      setTimeout(function () {
        try { res = { id: q.id, result: rpc(devs[0], q.method, q.params || {}, "http") }; }
        catch (e) { res = { id: q.id, error: { code: e.code || -1, message: e.message } }; }
        // an unreachable address on a real network takes a while to fail; keep scans short here
        ok(new Response(JSON.stringify(res), { headers: { "Content-Type": "application/json" } }));
      }, q.method === "HTTP.Request" ? 15 : 5);
    });
  };

  // ---------------------------------------------------------------- the Shellys' own schedules
  function runJobs(t) {
    var s = t + offset(t), mm = Math.floor(s / 60) % 60, hh = Math.floor(s / 3600) % 24, wd = DAYS[(Math.floor(s / 86400) + 4) % 7];
    devs.forEach(function (d) {
      d.jobs.forEach(function (j) {
        if (!j.enable) return;
        var p = String(j.timespec).trim().split(/\s+/);
        if (p.length !== 6 || +p[1] !== mm || +p[2] !== hh) return;
        if (p[5] !== "*" && p[5].toUpperCase().split(",").indexOf(wd) < 0) return;
        (j.calls || []).forEach(function (c) { if (c.method === "Switch.Set") setOut(d, c.params.id || 0, !!c.params.on, "schedule"); });
      });
    });
  }
  var lastMin = Math.floor(unix() / 60);
  setInterval(function () {
    if (busy) return;
    var m = Math.floor(unix() / 60);
    if (m > lastMin) { for (var k = lastMin + 1; k <= m; k++) runJobs(k * 60); lastMin = m; }
    clock();
  }, 1000);

  // ---------------------------------------------------------------- clock controls

  function jump(sec) {
    if (busy) return;
    busy = true; buttons(true);
    var end = shift + sec;
    (function step() {
      if (shift >= end) { done(); return; }
      shift = Math.min(end, shift + 60);
      var m = Math.floor(unix() / 60);
      for (var k = lastMin + 1; k <= m; k++) runJobs(k * 60);
      lastMin = m;
      devs.forEach(function (d) { d.timers.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); });
      if ((end - shift) % 3600 < 60) clock();
      pause().then(pause).then(pause).then(step);
    })();
    function done() {
      busy = false; buttons(false); clock(); save();
      devs.forEach(function (d) { try { d.ev("schedRefresh(100)"); } catch (e) {} });   // fresh times file, as the device would have fetched by now
      setTimeout(function () { if (window.DEVS) DEVS.forEach(function (x) { if (typeof refreshDev === "function") refreshDev(x, x === window.SEL); }); }, 300);
    }
  }
  function nextZman() {
    var t = unix(), best = null;
    devs.forEach(function (d) {
      var ev = JSON.parse(d.ev("JSON.stringify(events.map(function(e){return e.t;}))"));
      ev.forEach(function (x) { if (x > t + 60 && (best === null || x < best)) best = x; });
    });
    if (best === null) { note("No upcoming zman found yet. Wait a moment for the times file to load."); return; }
    jump(best - t - 120);   // stop 2 minutes before it
  }
  function wall() { setOut(devs[0], 0, !devs[0].outs[0], "switch"); clock(); }
  function reset() { if (!confirm("Reset the demo devices to their starting settings?")) return; try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); }

  function buttons(off) { Array.prototype.forEach.call(document.querySelectorAll(".sim button"), function (b) { b.disabled = off; }); }
  function note(t) { document.getElementById("simNote").textContent = t; }
  function clock() {
    var t = unix(), d = new Date(t * 1000);
    document.getElementById("simTime").textContent = d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + (shift ? " (shifted)" : "");
  }
  clock();
  return { jump: jump, nextZman: nextZman, wall: wall, reset: reset };
})();

// load the real page files from this site
(function () {
  var v = "?v=" + Date.now(), l = document.createElement("link");
  l.rel = "stylesheet"; l.href = "zmanim.css" + v; document.head.appendChild(l);
  var s = document.createElement("script"); s.src = "zmanim.js" + v; document.body.appendChild(s);
})();
</script>
</body>
